<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- AdSpot 3D Isometric Billboard Icon (Harmonious Sapphire Blue #284B63 + Oxford #1B3249 + Warm Beige #C8AD8D) -->
  <g transform="translate(4, 4)">
    <!-- Left Wing (Deep Oxford Blue) -->
    <polygon points="8,16 32,6 32,38 8,44" fill="#1B3249"/>
    <!-- Right Wing (Medium-Deep Sapphire Blue) -->
    <polygon points="32,6 56,16 56,44 32,38" fill="#284B63"/>
    <!-- Warm Beige Architectural Louvers -->
    <line x1="38" y1="9" x2="38" y2="39" stroke="#EBE2D3" stroke-width="1.6" opacity="0.8"/>
    <line x1="44" y1="11" x2="44" y2="41" stroke="#EBE2D3" stroke-width="1.6" opacity="0.8"/>
    <line x1="50" y1="13" x2="50" y2="42" stroke="#EBE2D3" stroke-width="1.6" opacity="0.8"/>
    <!-- Support Pillar & Warm Beige Base -->
    <rect x="29" y="38" width="6" height="14" rx="1" fill="#1B3249"/>
    <path d="M16 52 L48 52" stroke="#C8AD8D" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Verified Location Node (Warm Champagne Beige) -->
    <circle cx="20" cy="25" r="4.5" fill="#D4B895"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="39" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#1B3249">
    AD<tspan fill="#284B63">SPOT</tspan>
  </text>
  <text x="73" y="52" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#8C7355">
    TASHKENT AD MARKETPLACE
  </text>
</svg>
